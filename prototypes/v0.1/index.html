<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>小甘宝 HepPal · 肝细胞癌工作台原型 v0.2.1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239C5A3C'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='PingFang SC'%3E肝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>交互原型 v0.2.1</b> · 全部为模拟资料</span><span>仅本页演示 · 刷新重置 · 未接入 DSH / AI</span></div>
<div class="workspace" id="workspace">
  <aside class="sidebar" aria-label="小甘宝业务导航">
    <div class="brand no-mark">
      <div><strong>小甘宝</strong><span>HepPal · 肝与瘤，两条线</span></div>
    </div>
    <button class="profile profile-btn" id="profile-btn" data-action="profiles" aria-label="切换演示档案">
      <div class="avatar" id="profile-avatar" aria-hidden="true">陈</div>
      <div><b id="profile-name">陈建国的资料</b><span id="profile-meta">58 岁 · HBV · BCLC B</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav" aria-label="一级导航"></nav>
    <div id="subnav-dock" aria-label="二级导航"></div>
    <div class="sidebar-bottom">
      <span class="eyebrow">小 X 宝家族</span>
      <p>肝够不够，瘤到哪步，<br>两条线都要看清。</p>
      <button class="text-button" data-action="help">原型操作说明 ↗</button>
    </div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小甘宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="open-store" aria-label="资料目录：已激活"><i></i><span>资料目录</span><b>已激活</b></button>
        <button class="status" id="ready-session" data-action="start-session" aria-label="对话：未进入激活"><i class="grey"></i><span>对话</span><b>未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小甘宝">v0.2.1</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">小甘宝 · 与肝细胞癌患者和照护者一起，把两条线理清楚 <span class="ver-line"><b id="app-version">v0.2.1</b><em id="app-build">2026-10-23</em></span></footer>
  </div>
  <aside class="agent-pane" id="agent-pane" aria-label="AI 对话" hidden>
    <div class="agent-splitter" id="agent-splitter" role="separator" aria-orientation="vertical" aria-label="调整对话面板宽度"></div>
    <div class="agent-head">
      <div><span class="eyebrow">原生会话</span><h2>问小甘宝</h2></div>
      <div class="agent-head-actions">
        <button class="icon-button" data-action="agent-wider" aria-label="加宽对话面板">⇔</button>
        <button class="icon-button" data-action="agent-close" aria-label="收起对话面板">×</button>
      </div>
    </div>
    <div class="agent-body" id="agent-body">
      <div class="agent-note">这是原型里的对话占位，不会真正发送。接入 Desktop 后由宿主原生会话接管。</div>
      <div class="agent-msg agent-msg-user" id="agent-msg-user" hidden></div>
      <div class="agent-msg agent-msg-bot" id="agent-msg-bot" hidden></div>
    </div>
    <form class="agent-input" id="agent-form">
      <textarea id="agent-text" rows="2" placeholder="例如：帮我把 7 月和 9 月的 MDT 结论整理成复诊时要问的三句话" aria-label="输入问题"></textarea>
      <div class="agent-foot"><small>不代替医生判断</small><button type="submit">发送</button></div>
    </form>
  </aside>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小甘宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body></html>
